  else if(ST.type!=="all"&&x.t!==ST.type)return false;
  if(ST.room!=="all"&&x.r!==ST.room)return false;
  if(ST.res!=="all"&&!(x.all||x.res.indexOf(ST.res)>=0))return false;
  if(ST.q){
    var hay=(x.d+" "+x.n+" "+x.sub+" "+x.r+" "+TYPENAME[x.t]+" "+x.ppl.map(function(p){return p.join(" ");}).join(" ")+" "+x.items.join(" ")+" "+x.res.map(fullName).join(" ")).toLowerCase();
    var terms=ST.q.toLowerCase().split(/\s+/).filter(Boolean);
    for(var k=0;k<terms.length;k++){if(hay.indexOf(terms[k])<0)return false;}
  }
  return true;
}

function render(){
  var now=taipeiNow(),list=DATA.filter(matches),html="",lastS="",lastD="";
  list.forEach(function(x){
    if(ST.day==="all"){
      if(x.d!==lastD){html+='<div class="slot">'+x.d+'（'+wd(x.d)+'）</div>';lastD=x.d;}
    }else if(x.s!==lastS){html+='<div class="slot">'+x.s+'</div>';lastS=x.s;}
    var isLive=now.date===x.iso&&now.min>=x.sm&&now.min<x.em;
    var past=x.iso<now.date||(x.iso===now.date&&now.min>=x.em);
    var star=!!MINE[x.id],me=mine(x);
    html+='<article class="card t-'+x.t+(isLive?" live":"")+(past&&!isLive?" past":"")+(me?" me":"")+'" data-id="'+esc(x.id)+'">'
      +'<div class="top"><span class="time">'+x.s+'–'+x.e+'</span><span class="room">'+esc(x.r)+'</span>'
      +(isLive?'<span class="livetag">進行中</span>':'')+(me?'<span class="metag">我的課</span>':'')
      +'<button class="star'+(star?" on":"")+'" aria-label="加入我的課表" data-star="'+esc(x.id)+'">'+(star?"★":"☆")+'</button></div>'
      +'<h3>'+esc(x.n)+'</h3>'+(TYPENAME[x.t]===x.n?'':'<div class="tag">'+TYPENAME[x.t]+'</div>')
      +(x.sub?'<div class="sub">'+esc(x.sub)+'</div>':'');
    if(x.ppl.length){
      html+='<div class="ppl">'+x.ppl.map(function(p){return '<div><span>'+esc(p[0])+'</span><b style="font-weight:500">'+esc(p[1])+'</b></div>';}).join("")+'</div>';
    }
    if(x.link)html+='<a class="btn" href="'+x.link+'" target="_blank" rel="noopener">加入線上會議（Google Meet）</a>';
    if(x.items.length){
      html+='<details'+(ST.open?' open':'')+'><summary>'+(x.itemsTitle||"詳細")+'（'+x.items.length+'）</summary><ul class="items">'
        +x.items.map(function(i){return '<li>'+esc(i)+'</li>';}).join("")+'</ul></details>';
    }
    html+='</article>';
  });
  document.getElementById("list").innerHTML=html||'<div class="empty">沒有符合條件的課程</div>';
  document.getElementById("count").textContent="共 "+list.length+" 堂";
  document.getElementById("toggleAll").textContent=ST.open?"全部收合":"全部展開";
}

function draw(){render();}

function buildDays(){
  var el=document.getElementById("days"),now=taipeiNow();
  var b='<button data-day="all">全部<small>'+DATA.length+' 堂</small></button>';
  DATES.forEach(function(d){
    var c=DATA.filter(function(x){return x.d===d[0];}).length;
    b+='<button data-day="'+d[0]+'"'+(d[1]<now.date?' class="past"':'')+'>'+d[0]+'（'+wd(d[0])+'）<small>'+c+' 堂</small></button>';
  });
  el.innerHTML=b;
  el.querySelectorAll("button").forEach(function(x){
    x.addEventListener("click",function(){ST.day=x.dataset.day;syncUI();draw();window.scrollTo(0,0);});
  });
}
function buildChips(){
  var el=document.getElementById("chips");
  el.innerHTML=TYPES.map(function(t){return '<button class="chip" data-t="'+t[0]+'">'+t[1]+'</button>';}).join("");
  el.querySelectorAll(".chip").forEach(function(b){
    b.addEventListener("click",function(){ST.type=b.dataset.t;syncUI();draw();});
  });
}
function buildRes(){
  document.getElementById("res").innerHTML='<option value="all">全部住院醫師</option>'
    +RESIDENTS.map(function(r){return '<option value="'+r[0]+'">'+r[1]+'</option>';}).join("");
  document.getElementById("res").value=ST.res;
}
function buildRooms(){
  var rooms=[];
  DATA.forEach(function(x){if(x.r!=="—"&&rooms.indexOf(x.r)<0)rooms.push(x.r);});
  var sel=document.getElementById("room");
  sel.innerHTML='<option value="all">全部地點</option>'+rooms.map(function(r){return '<option value="'+esc(r)+'">'+esc(r)+'</option>';}).join("");
  sel.value=ST.room;
}
function syncUI(){
  document.querySelectorAll("#days button").forEach(function(b){b.classList.toggle("on",b.dataset.day===ST.day);});
  document.querySelectorAll(".chip").forEach(function(b){b.classList.toggle("on",b.dataset.t===ST.type);});
  var on=document.querySelector("#days button.on");if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest"});
}

function nextSession(now){
  var best=null;
  DATA.forEach(function(x){
    if(x.t==="oth")return;
    if(ST.res!=="all"&&!(x.all||x.res.indexOf(ST.res)>=0))return;
    if(x.iso>now.date||(x.iso===now.date&&x.sm>now.min)){
      if(!best||x.iso<best.iso||(x.iso===best.iso&&x.sm<best.sm))best=x;
    }
  });
  return best;
}
function banner(){
  var n=taipeiNow(),el=document.getElementById("banner");
  var live=DATA.filter(function(x){return x.iso===n.date&&n.min>=x.sm&&n.min<x.em&&(ST.res==="all"||x.all||x.res.indexOf(ST.res)>=0);});
  var nx=nextSession(n),who=ST.res==="all"?"":"（"+fullName(ST.res)+"）";
  var h="";
  if(live.length)h+="現在進行中"+who+"：<b>"+esc(live[0].n+(live[0].sub?" "+live[0].sub:""))+"</b>（"+esc(live[0].r)+"）<br>";
  if(nx)h+="下一堂"+who+"：<b>"+nx.d+"（"+wd(nx.d)+"）"+nx.s+"</b> "+esc(nx.n+(nx.sub?" "+nx.sub:""))+"｜"+esc(nx.r);
  else if(!live.length)h="本季課表已全部結束。";
  el.innerHTML=h;el.hidden=false;
}

document.addEventListener("click",function(e){
  var s=e.target.closest&&e.target.closest("[data-star]");
  if(!s)return;
  var id=s.getAttribute("data-star");
  if(MINE[id])delete MINE[id];else MINE[id]=1;
  saveMine();
  if(ST.type==="mine")render();
  else{s.classList.toggle("on",!!MINE[id]);s.textContent=MINE[id]?"★":"☆";}
});
document.getElementById("q").addEventListener("input",function(e){ST.q=e.target.value.trim();draw();});
document.getElementById("room").addEventListener("change",function(e){ST.room=e.target.value;draw();});
document.getElementById("res").addEventListener("change",function(e){ST.res=e.target.value;saveRes();banner();draw();});
document.getElementById("toggleAll").addEventListener("click",function(){ST.open=!ST.open;render();});
document.getElementById("goNow").addEventListener("click",function(){
  var n=taipeiNow(),nx=nextSession(n)||DATA[DATA.length-1];
  ST.day=nx.d;ST.type="all";ST.q="";ST.room="all";document.getElementById("q").value="";
  syncUI();buildRooms();draw();
  var t=document.querySelector(".card.live");
  if(!t){
    var cur=n.date===nx.iso?n.min:0,best=null;
    document.querySelectorAll(".slot").forEach(function(s){if(!best&&mm(s.textContent)>=cur)best=s;});
    t=best;
  }
  if(t)t.scrollIntoView({behavior:"smooth",block:"center"});
});

(function init(){
  var n=taipeiNow(),nx=nextSession(n);
  ST.day=nx?nx.d:"all";
  buildDays();buildChips();buildRes();buildRooms();syncUI();banner();draw();
})();
</script>
</body>
</html>
